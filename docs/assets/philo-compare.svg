<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Architecture comparison</title>
  <desc id="desc">A side by side comparison of the threaded mandatory architecture and the process-based bonus architecture used in the philosophers project.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1120" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E9D3"/>
      <stop offset="1" stop-color="#E5F1F1"/>
    </linearGradient>
    <linearGradient id="left" x1="70" y1="94" x2="560" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8ED"/>
      <stop offset="1" stop-color="#F4F8FC"/>
    </linearGradient>
    <linearGradient id="right" x1="640" y1="94" x2="1130" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F8FA"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" rx="28" fill="url(#bg)"/>
  <text x="80" y="78" fill="#173042" font-family="Georgia, serif" font-size="42" font-weight="700">Two ways to solve the same synchronization problem</text>
  <text x="80" y="116" fill="#4A6574" font-family="Trebuchet MS, sans-serif" font-size="22">Mandatory and bonus share the same goal, but their isolation model and cleanup strategy are very different.</text>

  <rect x="66" y="154" width="500" height="564" rx="24" fill="url(#left)" stroke="#D9B97B" stroke-width="2"/>
  <rect x="634" y="154" width="500" height="564" rx="24" fill="url(#right)" stroke="#78A9B8" stroke-width="2"/>

  <text x="104" y="212" fill="#754B0E" font-family="Georgia, serif" font-size="34" font-weight="700">Mandatory</text>
  <text x="104" y="244" fill="#7B5B22" font-family="Trebuchet MS, sans-serif" font-size="20">Threads + mutexes + shared memory</text>

  <text x="672" y="212" fill="#1C586C" font-family="Georgia, serif" font-size="34" font-weight="700">Bonus</text>
  <text x="672" y="244" fill="#2D6C7B" font-family="Trebuchet MS, sans-serif" font-size="20">Processes + semaphores + parent orchestration</text>

  <g>
    <rect x="110" y="286" width="412" height="78" rx="16" fill="#FFF3D5" stroke="#D8B26A"/>
    <text x="316" y="319" text-anchor="middle" fill="#6B4B16" font-family="Trebuchet MS, sans-serif" font-size="26" font-weight="700">Monitor loop</text>
    <text x="316" y="346" text-anchor="middle" fill="#7A6137" font-family="Trebuchet MS, sans-serif" font-size="18">Checks death time and meal completion</text>

    <rect x="110" y="392" width="186" height="90" rx="16" fill="#F4FAFF" stroke="#9FC2DC"/>
    <rect x="316" y="392" width="206" height="90" rx="16" fill="#F4FAFF" stroke="#9FC2DC"/>
    <text x="203" y="425" text-anchor="middle" fill="#244C63" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">Philosopher</text>
    <text x="203" y="453" text-anchor="middle" fill="#4F6E80" font-family="Trebuchet MS, sans-serif" font-size="17">one thread per worker</text>
    <text x="419" y="425" text-anchor="middle" fill="#244C63" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">Fork order</text>
    <text x="419" y="453" text-anchor="middle" fill="#4F6E80" font-family="Trebuchet MS, sans-serif" font-size="17">precomputed first/second locks</text>

    <rect x="110" y="510" width="412" height="114" rx="16" fill="#EDF7F2" stroke="#8FBEA0"/>
    <text x="316" y="545" text-anchor="middle" fill="#27543B" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">Protected state</text>
    <text x="316" y="576" text-anchor="middle" fill="#486653" font-family="Trebuchet MS, sans-serif" font-size="18">write mutex | meals mutex | death mutex | end mutex</text>
    <text x="316" y="604" text-anchor="middle" fill="#486653" font-family="Trebuchet MS, sans-serif" font-size="18">shared timestamps and counters</text>
  </g>

  <g stroke="#C9A15E" stroke-width="4" stroke-linecap="round">
    <line x1="316" y1="364" x2="316" y2="392"/>
    <line x1="203" y1="482" x2="203" y2="510"/>
    <line x1="419" y1="482" x2="419" y2="510"/>
  </g>

  <g>
    <rect x="678" y="286" width="412" height="78" rx="16" fill="#DFF3F8" stroke="#73AABB"/>
    <text x="884" y="319" text-anchor="middle" fill="#1F6171" font-family="Trebuchet MS, sans-serif" font-size="26" font-weight="700">Parent controller</text>
    <text x="884" y="346" text-anchor="middle" fill="#3F7180" font-family="Trebuchet MS, sans-serif" font-size="18">forks children, waits, kills, reaps</text>

    <rect x="678" y="392" width="186" height="90" rx="16" fill="#F4FBFF" stroke="#98C8D9"/>
    <rect x="884" y="392" width="206" height="90" rx="16" fill="#F4FBFF" stroke="#98C8D9"/>
    <text x="771" y="425" text-anchor="middle" fill="#1E5361" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">Children</text>
    <text x="771" y="453" text-anchor="middle" fill="#486C76" font-family="Trebuchet MS, sans-serif" font-size="17">one process per philosopher</text>
    <text x="987" y="425" text-anchor="middle" fill="#1E5361" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">Death watcher</text>
    <text x="987" y="453" text-anchor="middle" fill="#486C76" font-family="Trebuchet MS, sans-serif" font-size="17">thread inside each child</text>

    <rect x="678" y="510" width="412" height="114" rx="16" fill="#EEF0FF" stroke="#9FAEE4"/>
    <text x="884" y="545" text-anchor="middle" fill="#38478D" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">Semaphore roles</text>
    <text x="884" y="576" text-anchor="middle" fill="#5E679B" font-family="Trebuchet MS, sans-serif" font-size="18">forks | write | death | meals | resources</text>
    <text x="884" y="604" text-anchor="middle" fill="#5E679B" font-family="Trebuchet MS, sans-serif" font-size="18">counting, serialization, completion tracking</text>
  </g>

  <g stroke="#71A8B8" stroke-width="4" stroke-linecap="round">
    <line x1="884" y1="364" x2="884" y2="392"/>
    <line x1="771" y1="482" x2="771" y2="510"/>
    <line x1="987" y1="482" x2="987" y2="510"/>
  </g>

  <rect x="130" y="658" width="940" height="48" rx="24" fill="#173042"/>
  <text x="600" y="689" text-anchor="middle" fill="#F6F4EE" font-family="Trebuchet MS, sans-serif" font-size="22">Same problem. Different primitives. Different failure modes. Stronger systems intuition.</text>
</svg>
