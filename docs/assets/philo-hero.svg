<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Philosophers hero banner</title>
  <desc id="desc">An illustrated banner showing philosophers seated around a table, with labels for threads, processes, timing, cleanup, and synchronization.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1080" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#12344A"/>
    </linearGradient>
    <linearGradient id="card" x1="220" y1="110" x2="920" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16324F"/>
      <stop offset="1" stop-color="#10273C"/>
    </linearGradient>
    <linearGradient id="table" x1="470" y1="190" x2="730" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D28A"/>
      <stop offset="1" stop-color="#D89B3D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="1030" cy="92" r="118" fill="#1D4E63" opacity="0.35"/>
  <circle cx="144" cy="566" r="148" fill="#153B4B" opacity="0.45"/>
  <rect x="60" y="54" width="1080" height="532" rx="28" fill="url(#card)" stroke="#3A6B82" stroke-width="2"/>

  <text x="110" y="138" fill="#F6F2E8" font-family="Georgia, serif" font-size="52" font-weight="700">Dining Philosophers</text>
  <text x="110" y="178" fill="#AFC8D6" font-family="Trebuchet MS, sans-serif" font-size="24">A 42 systems project about concurrency, timing, and correctness under contention.</text>

  <circle cx="600" cy="330" r="128" fill="url(#table)" stroke="#F6E4B5" stroke-width="8"/>
  <circle cx="600" cy="330" r="88" fill="#F8EED6" opacity="0.85"/>
  <text x="600" y="314" text-anchor="middle" fill="#6B4B16" font-family="Trebuchet MS, sans-serif" font-size="26" font-weight="700">threads + mutexes</text>
  <text x="600" y="350" text-anchor="middle" fill="#6B4B16" font-family="Trebuchet MS, sans-serif" font-size="26" font-weight="700">processes + semaphores</text>

  <g>
    <circle cx="600" cy="138" r="42" fill="#7FD1B9"/>
    <circle cx="782" cy="235" r="42" fill="#84C5E8"/>
    <circle cx="715" cy="462" r="42" fill="#F3B164"/>
    <circle cx="485" cy="462" r="42" fill="#E88D8D"/>
    <circle cx="418" cy="235" r="42" fill="#B3C47C"/>

    <text x="600" y="146" text-anchor="middle" fill="#0F172A" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">P1</text>
    <text x="782" y="243" text-anchor="middle" fill="#0F172A" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">P2</text>
    <text x="715" y="470" text-anchor="middle" fill="#0F172A" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">P3</text>
    <text x="485" y="470" text-anchor="middle" fill="#0F172A" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">P4</text>
    <text x="418" y="243" text-anchor="middle" fill="#0F172A" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">P5</text>
  </g>

  <g stroke="#F6E4B5" stroke-width="6" stroke-linecap="round">
    <line x1="600" y1="188" x2="600" y2="210"/>
    <line x1="742" y1="262" x2="722" y2="274"/>
    <line x1="690" y1="425" x2="678" y2="405"/>
    <line x1="510" y1="425" x2="522" y2="405"/>
    <line x1="458" y1="262" x2="478" y2="274"/>
  </g>

  <g>
    <rect x="108" y="462" width="170" height="46" rx="23" fill="#133C4D" stroke="#5FBFA7"/>
    <rect x="292" y="462" width="188" height="46" rx="23" fill="#133C4D" stroke="#8BC0E4"/>
    <rect x="494" y="462" width="124" height="46" rx="23" fill="#133C4D" stroke="#F0C27D"/>
    <rect x="632" y="462" width="128" height="46" rx="23" fill="#133C4D" stroke="#F29C9C"/>
    <rect x="774" y="462" width="186" height="46" rx="23" fill="#133C4D" stroke="#B5D07B"/>

    <text x="193" y="492" text-anchor="middle" fill="#EAF4F7" font-family="Trebuchet MS, sans-serif" font-size="20">Race conditions</text>
    <text x="386" y="492" text-anchor="middle" fill="#EAF4F7" font-family="Trebuchet MS, sans-serif" font-size="20">Threads and forks</text>
    <text x="556" y="492" text-anchor="middle" fill="#EAF4F7" font-family="Trebuchet MS, sans-serif" font-size="20">Timing</text>
    <text x="696" y="492" text-anchor="middle" fill="#EAF4F7" font-family="Trebuchet MS, sans-serif" font-size="20">Cleanup</text>
    <text x="867" y="492" text-anchor="middle" fill="#EAF4F7" font-family="Trebuchet MS, sans-serif" font-size="20">Process isolation</text>
  </g>

  <text x="110" y="548" fill="#9FC2D0" font-family="Trebuchet MS, sans-serif" font-size="20">Built to understand how small synchronization choices change liveness, readability, and shutdown behavior.</text>
</svg>
